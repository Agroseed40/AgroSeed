name: Verify AgroSeed live test checkout quote (read-only)
on:
  push:
    branches:
      - codex/address-add-browser-diagnosis-2026-11-22
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa-quote-live.mjs
